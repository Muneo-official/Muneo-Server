spring:
  application:
    name: muneo-server
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.example.muneoserver: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  ai:
    base-url: ${AI_API_BASE_URL}
    connect-timeout-ms: ${AI_API_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_API_READ_TIMEOUT_MS:300000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
    cookie:
      access-token-name: access_token
      refresh-token-name: refresh_token
      same-site: ${COOKIE_SAME_SITE:None}
      domain: ${COOKIE_DOMAIN:}
      secure: ${COOKIE_SECURE:false}
    oauth:
      kakao-login-url: ${OAUTH_KAKAO_LOGIN_URL}
      frontend-success-uri: ${OAUTH_FRONTEND_SUCCESS_URI}
      frontend-signup-uri: ${OAUTH_FRONTEND_SIGNUP_URI}
      frontend-failure-uri: ${OAUTH_FRONTEND_FAILURE_URI}
      social-signup-ticket-expiration: ${OAUTH_SOCIAL_SIGNUP_TICKET_EXPIRATION:1800}
    email:
      enabled: ${EMAIL_FEATURE_ENABLED:false}
      verification-code-expiration: ${EMAIL_VERIFICATION_CODE_EXPIRATION:300}
      password-reset-code-expiration: ${PASSWORD_RESET_CODE_EXPIRATION:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-northeast-2}
    presigned-url-expiration: ${S3_PRESIGNED_URL_EXPIRATION:10m}
    estimate-directory: ${S3_ESTIMATE_DIRECTORY:estimate}
    post-directory: ${S3_POST_DIRECTORY:post}
