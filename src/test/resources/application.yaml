spring:
  mongodb:
    uri: mongodb://localhost:27017/estimate_db_test
    database: estimate_db_test
  datasource:
    url: jdbc:h2:mem:muneo-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    mongodb:
      auto-index-creation: false
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-name: kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 0

app:
  ai:
    base-url: http://127.0.0.1:8000
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
  security:
    jwt:
      secret: test-secret-key-test-secret-key-test-secret-key
      access-token-expiration: 3600
      refresh-token-expiration: 1209600
    cookie:
      access-token-name: access_token
      refresh-token-name: refresh_token
      same-site: Lax
      domain:
      secure: false
    oauth:
      frontend-success-uri: http://localhost:3000/auth/success
      frontend-signup-uri: http://localhost:3000/auth/social-signup
      frontend-failure-uri: http://localhost:3000/auth/failure
      social-signup-ticket-expiration: 1800
    email:
      enabled: false
      verification-code-expiration: 300
      password-reset-code-expiration: 300
  cors:
    allowed-origins: http://localhost:3000
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    presigned-url-expiration: 10m
    estimate-directory: estimate
    post-directory: post
